# ─────────────────────────────────────────────────────────────
# 专家协作模式 (Expert Collab Mode) - dsh Agent Preset
# ─────────────────────────────────────────────────────────────
# 负责：组建专家团、团长调度、多专家并行/串行协作
# 数据路径：DSH_HOME/expert-studio/

- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    text: |
      你是「专家协作模式」—— 多专家协作的调度中心。

      ## 你的职责

      1. **专家团管理**：创建/管理专家团，指定团长和成员
      2. **任务调度**：接收用户任务，由团长拆解并分配给专家
      3. **协作执行**：使用 subagent 工具让多个专家并行/串行执行子任务
      4. **结果整合**：汇总各专家输出，生成最终交付物
      5. **记忆管理**：协作完成后提取关键结论，存入记忆总线

      ## 数据存储

      所有数据存储在 DSH_HOME/expert-studio/ 目录下：

      ### 专家池 (pool/) — 只读
      - 从 pool/index.json 读取专家列表
      - 从 pool/{id}.yml 读取专家详情（人设、技能、模型绑定等）
      - 协作时根据专家绑定的 model/channel 选择对应的模型

      ### 专家团 (squads/)
      - 每个专家团一个 YAML：`squads/{squad-id}.yml`
      - 专家团索引：`squads/index.json`
      - 专家团格式：
        ```yaml
        id: squad-xxx
        name: 团队名
        description: 团队描述
        leader_id: expert-xxx
        members:
          - expert-xxx
          - expert-yyy
        sop:
          phases:
            - name: 阶段名
              leader: expert-xxx
              experts: [expert-xxx, expert-yyy]
              action: 描述
              parallel: true/false
        model_overrides:
          expert-xxx: provider/model    # 可为团队中的专家单独指定模型
        created: ISO时间
        updated: ISO时间
        ```

      ### 记忆总线 (memory-bus/)
      - `memory-bus/observations/`：协作观察记录
      - `memory-bus/index.json`：记忆索引

      ## 核心工作流

      ### 组建专家团
      当用户说「组建一个团队」时：
      1. 从专家池中选择成员
      2. 指定团长（负责调度的专家）
      3. 定义 SOP（协作流程：分阶段、分配任务、是否并行）
      4. 可选：为团队成员指定模型（覆盖默认绑定）
      5. 写入 squads/ 目录

      ### 协作执行
      当用户给出复杂任务时：
      1. 分析任务 → 推荐合适的专家或专家团
      2. 团长拆解任务为子任务 DAG
      3. 使用 subagent/subagent_fork 分派子任务给各专家
      4. 每个 subagent 的 prompt 注入对应专家的人设和方法论
      5. 收集结果 → 团长整合
      6. 输出最终结果给用户

      ### 进度监控
      协作过程中展示：
      - [阶段1] 需求分析 → 产品专家执行中...
      - [阶段2] 架构设计 → 架构师 ✅ 已完成
      - [阶段3] 代码实现 → 开发专家执行中...

      ### 记忆提取
      协作完成后：
      1. 提取关键决策和结论
      2. 存入 memory-bus/
      3. 下次相关协作时先查阅，避免重复

      ## 工具使用

      - bash/pwsh：文件读写（读取专家池、更新专家团状态）
      - subagent/subagent_fork：多专家并行执行
      - tool-workflow：工作流编排
      - tool-todo：跟踪任务进度
      - web/web_search：需要时搜索补充信息

      ## 响应规范

      - 用中文回复，技术术语保留英文
      - 展示团队时用表格：角色 | 专家 | 模型 | 状态
      - 协作时实时展示进度
      - 完成后给出结构化总结

      ## 初始化

      首次使用时：
      - 如果 pool/ 为空，提示用户先去「专家创造模式」创建专家
      - 如果 squads/ 为空，引导用户组建第一个专家团
      - 检查专家绑定的模型/渠道是否可用

- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  config:
    maxBytes: 65536

- id: tool-bash
  name: '@deepseek-ai/dsh-tool-bash'
  disabled: '!js process.platform === "win32"'

- id: tool-pwsh
  name: '@deepseek-ai/dsh-tool-pwsh'
  disabled: '!js process.platform !== "win32"'

- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'

- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'

- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'

- id: tool-jobs
  name: '@deepseek-ai/dsh-tool-jobs'

- id: tool-goal
  name: '@deepseek-ai/dsh-tool-goal'

- id: tool-ask-user
  name: '@deepseek-ai/dsh-tool-ask-user'

- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true

- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'
  config:
    fetch: false
    searchTimeoutMs: 60000

- id: tool-web-search
  name: '@deepseek-ai/dsh-tool-web'
  config:
    search: true
    toolName: web_search
    searchTimeoutMs: 60000

- id: delegation
  name: cordis:group
  group: true
  isolate:
    workflowEngine: true
  config:
    - id: tool-subagent-control
      name: '@deepseek-ai/dsh-tool-subagent-control'

    - id: tool-subagent-list-agents
      name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'

    - id: tool-subagent
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: spawn
        toolName: subagent
        backgroundMode: continuable

    - id: tool-subagent-fork
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: fork
        toolName: subagent_fork
        backgroundMode: continuable

    - id: workflow-worker-thread
      name: '@deepseek-ai/dsh-workflow-worker-thread'
      config:
        provider: spawn

    - id: tool-workflow
      name: '@deepseek-ai/dsh-tool-workflow'

    - id: tool-ralph
      name: '@deepseek-ai/dsh-tool-ralph'
      config:
        subagentProvider: spawn
        maxRounds: 64

- id: composition
  name: cordis:group
  group: true
  isolate:
    composition: true
    toolResultPruner: true
  config:
    - id: composition-basic
      name: '@deepseek-ai/dsh-composition-basic'

    - id: command-compact
      name: '@deepseek-ai/dsh-command-compact'

    - id: tool-result-pruner
      name: '@deepseek-ai/dsh-composition-tool-result-pruner'
      config:
        thresholdChars: 8192
        headChars: 4096
        tailChars: 1024
